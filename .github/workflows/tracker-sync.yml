name: tracker-sync

on:
  schedule:
    - cron: "0 * * * *"    # hourly
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Pull tracker state into roadmap YAML
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/sync_trackers.py memory/team/*/roadmap.yaml
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/tracker-sync
          commit-message: "chore(sync): refresh tracker_* from Linear/Jira"
          title: "chore(sync): tracker state → roadmap.yaml"
          body: |
            Automated sync of `tracker_status`, `target_date`, and `owner`
            from Linear/Jira into roadmap YAML.

            PM-owned fields (`title`, `strategic_bet`, `adr_refs`) are
            untouched. If this PR shows a diff on a PM-owned field,
            something is wrong with the sync script — investigate before
            merging.
          labels: |
            tracker-sync
            automated
